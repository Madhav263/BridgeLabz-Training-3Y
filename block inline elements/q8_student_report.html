<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>
    <!-- School name -->
    <h1>Greenfield Public School</h1>

    <table border="1" cellpadding="6">
        <caption>Annual Report Card</caption>
        <thead>
            <tr>
                <!-- colspan: student details across all columns -->
                <th colspan="4" title="Student information">Student: Madhav | Class: 10 | Roll No: 21</th>
            </tr>
            <tr>
                <th title="Serial number">S.No</th>
                <th title="Name of the subject">Subject</th>
                <th title="Marks obtained">Marks Obtained</th>
                <th title="Maximum marks">Maximum Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>1</td><td>English</td><td>85</td><td>100</td></tr>
            <tr><td>2</td><td>Mathematics</td><td>92</td><td>100</td></tr>
            <tr><td>3</td><td>Science</td><td>88</td><td>100</td></tr>
            <tr><td>4</td><td>Social Science</td><td>81</td><td>100</td></tr>
            <tr><td>5</td><td>Hindi</td><td>79</td><td>100</td></tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="2" title="Sum of all marks">Total</th>
                <td>Total marks obtained</td>
                <td>500</td>
            </tr>
            <tr>
                <th colspan="2" title="Overall percentage">Percentage</th>
                <td colspan="2">Percentage (total / 500 x 100)</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
