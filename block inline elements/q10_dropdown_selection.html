<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection Page</title>
</head>
<body>
    <h1>Select Your Travel Preferences</h1>

    <form action="#" method="get">
        <!-- Country: India is pre-selected -->
        <p>
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="india" selected>India</option>
                <option value="usa">USA</option>
                <option value="uk">United Kingdom</option>
            </select>
        </p>

        <!-- State: Uttar Pradesh is pre-selected -->
        <p>
            <label for="state">State:</label>
            <select id="state" name="state">
                <option value="up" selected>Uttar Pradesh</option>
                <option value="rj">Rajasthan</option>
                <option value="mh">Maharashtra</option>
            </select>
        </p>

        <!-- City: Agra is pre-selected -->
        <p>
            <label for="city">City:</label>
            <select id="city" name="city">
                <option value="agra" selected>Agra</option>
                <option value="mathura">Mathura</option>
                <option value="lucknow">Lucknow</option>
            </select>
        </p>

        <!-- Favorite tourist place: Taj Mahal is pre-selected -->
        <p>
            <label for="place">Favorite Tourist Place:</label>
            <select id="place" name="place">
                <option value="taj" selected>Taj Mahal</option>
                <option value="fort">Agra Fort</option>
                <option value="krishna">Krishna Janmabhoomi</option>
            </select>
        </p>
    </form>

    <!-- Summary of choices -->
    <p>
        <strong>Summary:</strong> My favorite tourist place is the Taj Mahal in Agra, Uttar Pradesh, India.
    </p>
</body>
</html>
