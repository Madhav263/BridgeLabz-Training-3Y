<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
    }

    .container {
      height: 100vh;
      display: grid;

      grid-template-columns: 200px 1fr;
      grid-template-rows: 100px 1fr 100px;

      gap: 16px;
      padding: 16px;

      background-color: rgb(178, 152, 119);
    }

    .items {
      background-color: rgb(172, 118, 119);
      border: 3px solid black;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: bold;
    }

    .header {
      grid-column: 1 / 3;
    }

    .sidebar {
      grid-row: 2 / 4;
    }

    .content1 {
      grid-column: 2;
      grid-row: 2;
    }

    .content-row {
      grid-column: 2;
      grid-row: 3;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .footer {
      grid-column: 1 / 3;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="items header">
      Header
    </div>

    <div class="items sidebar">
      Side Bar
    </div>

    <div class="items content1">
      Content 1
    </div>

    <div class="content-row">

      <div class="items">
        Content 2
      </div>

      <div class="items">
        Content 3
      </div>

    </div>

    <div class="items footer">
      Footer
    </div>

  </div>

</body>
</html>
