<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="q8_dashboard.css">
</head>
<body>
    <!-- Fixed header -->
    <header class="top-bar">
        <h1>My Dashboard</h1>
    </header>

    <div class="layout">
        <!-- Sidebar with navigation -->
        <aside class="sidebar">
            <nav>
                <a href="#">Overview</a>
                <a href="#">Reports</a>
                <a href="#">Users</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="content">
            <section class="box">
                <h2>Total Users</h2>
                <p>1,250 registered users this month.</p>
            </section>
            <section class="box">
                <h2>Monthly Sales</h2>
                <p>&#8377;3,45,000 in sales, up 8% from last month.</p>
            </section>
            <section class="box">
                <h2>Pending Tasks</h2>
                <p>12 tasks are waiting for review.</p>
            </section>
        </main>
    </div>
</body>
</html>
